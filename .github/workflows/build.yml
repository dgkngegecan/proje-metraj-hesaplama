# Temiz bir checkout'un gerçekten derlendiğini ve testlerin geçtiğini doğrular.
#
# Bu iş akışının asıl amacı T4-1 ve T4-3'tür: arayüz derlemesi artık build'in
# parçası (bkz. src/Metraj.Api/Metraj.Api.csproj) ve araç zinciri sabitlendi.
# Buradaki koşu, "benim makinemde çalışıyor" ile teslim edilen sürüm arasındaki
# farkı yakalar -- kullanıcının eski arayüzlü bir .exe almasının önündeki tek
# otomatik engel budur.
name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    # Masaüstü katmanı WPF; yalnızca Windows'ta derlenir.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: .NET SDK (global.json'a göre)
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Node (.nvmrc'ye göre)
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: src/Metraj.Web/package-lock.json

      - name: Arayüz bağımlılıkları
        working-directory: src/Metraj.Web
        run: npm ci

      - name: Restore
        run: dotnet restore Metraj.sln

      # Arayüz derlemesi bu adımın içinde MSBuild tarafından çalıştırılır.
      - name: Build
        run: dotnet build Metraj.sln --no-restore -c Release

      - name: Test
        run: dotnet test Metraj.sln --no-build -c Release

      - name: Tek EXE yayınla
        run: >-
          dotnet publish src/Metraj.Desktop/Metraj.Desktop.csproj
          --no-restore
          -c Release
          -r win-x64
          --self-contained true
          -o artifacts/ProjeMetraj-win-x64

      - name: İndirilecek dosyayı adlandır
        shell: pwsh
        run: Move-Item -LiteralPath artifacts/ProjeMetraj-win-x64/Metraj.Desktop.exe -Destination artifacts/ProjeMetraj-win-x64/ProjeMetraj-win-x64.exe

      - name: Actions indirmesine ekle
        uses: actions/upload-artifact@v4
        with:
          name: ProjeMetraj-win-x64
          path: artifacts/ProjeMetraj-win-x64/ProjeMetraj-win-x64.exe
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

      - name: Etiketli sürümü GitHub Release olarak yayınla
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $asset = 'artifacts/ProjeMetraj-win-x64/ProjeMetraj-win-x64.exe'
          gh release view $env:GITHUB_REF_NAME 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:GITHUB_REF_NAME $asset --clobber
          } else {
            gh release create $env:GITHUB_REF_NAME $asset --title "Proje Metraj $env:GITHUB_REF_NAME" --generate-notes
          }
